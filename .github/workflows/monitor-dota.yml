name: Monitor external Dota2 repo

on:
  schedule:
    # запуск каждые 15 минут — измените cron при необходимости
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/monitor_dota_repo.py https://github.com/muk-as/DOTA2_WEB.git

      - name: Commit repos_state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update repos_state.json (monitoring state)"
            git push
          else
            echo "No state changes to commit"
          fi
