name: Dota2 Tracker

on:
  schedule:
    # GitHub Actions не поддерживает запуск чаще, чем раз в 5 минут -
    # расписание "* * * * *" (каждую минуту) GitHub либо отклоняет, либо
    # сильно занижает частоту запуска без предупреждений. "*/5 * * * *"
    # - это реально работающий минимум.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Не даём запускам накладываться друг на друга - иначе два параллельных
# запуска могут одновременно пытаться сделать `git push` state.json и
# один из них будет падать с конфликтом.
concurrency:
  group: dota2-tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update tracker state"

          git pull --rebase origin ${{ github.ref_name }}
          git push
